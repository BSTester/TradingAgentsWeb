<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>封面页居中测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        }
        
        .report-cover {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            padding: 0;
            margin: 0;
        }
        
        .top-section {
            padding: 2.5rem 0 0 0;
            width: 100%;
        }
        
        .top-content {
            text-align: center;
            color: white;
            width: 100%;
        }
        
        .english-title {
            font-size: 14pt;
            letter-spacing: 0.3em;
            margin-bottom: 0.75rem;
            opacity: 0.95;
            text-align: center;
            margin: 0 auto 0.75rem auto;
        }
        
        .chinese-title {
            font-size: 48pt;
            font-weight: 300;
            margin: 0 auto;
            letter-spacing: 0.05em;
            text-align: center;
        }
        
        .middle-section {
            padding: 0;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        
        .white-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 480px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            margin: 0 auto;
        }
        
        .market-tag {
            text-align: center;
            margin-bottom: 1.5rem;
            width: 100%;
        }
        
        .market-badge {
            display: inline-block;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: white;
            padding: 0.5rem 1.8rem;
            border-radius: 20px;
            font-size: 11pt;
            font-weight: 500;
        }
        
        .stock-info {
            text-align: center;
            margin-bottom: 1.8rem;
            width: 100%;
        }
        
        .stock-code {
            font-size: 56pt;
            font-weight: bold;
            margin: 0;
            padding: 0;
            color: #1a1a1a;
            letter-spacing: 0.05em;
            line-height: 1.1;
            text-align: center;
        }
        
        .company-name {
            font-size: 15pt;
            margin: 0.8rem auto 0 auto !important;
            padding: 0 !important;
            color: #666;
            font-weight: 400;
            line-height: 1.4;
            text-align: center !important;
            display: block;
            width: 100%;
        }
        
        .divider {
            height: 2px;
            background: linear-gradient(to right, transparent, #e5e7eb, transparent);
            margin: 1.8rem 0;
            width: 100%;
        }
        
        .recommendation-section {
            text-align: center;
            width: 100%;
        }
        
        .recommendation-label {
            font-size: 12pt;
            color: #666;
            letter-spacing: 0.2em;
            text-align: center !important;
            margin: 0 auto 1rem auto !important;
            padding: 0 !important;
            display: block;
            width: 100%;
        }
        
        .recommendation-card-wrapper {
            text-align: center;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        
        .recommendation-card {
            background: linear-gradient(135deg, #10b981, #3b82f6);
            border-radius: 12px;
            padding: 1.2rem 3rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        
        .recommendation-text {
            font-size: 42pt;
            font-weight: bold;
            margin: 0 !important;
            padding: 0 !important;
            color: white;
            letter-spacing: 0.05em;
            text-align: center !important;
            display: block;
            width: 100%;
        }
        
        .bottom-section {
            padding: 0 0 2.5rem 0;
            width: 100%;
        }
        
        .bottom-content {
            text-align: center;
            color: white;
            font-size: 10pt;
            width: 100%;
        }
        
        .bottom-content p {
            margin: 0 auto;
            opacity: 0.95;
            text-align: center;
        }
        
        .bottom-content p:first-child {
            margin-bottom: 0.4rem;
        }
    </style>
</head>
<body>
    <div class="report-cover">
        <!-- 顶部区域 -->
        <div class="top-section">
            <div class="top-content">
                <p class="english-title">TRADING ANALYSIS REPORT</p>
                <h1 class="chinese-title">股票分析报告</h1>
            </div>
        </div>

        <!-- 中间区域 - 股票信息 -->
        <div class="middle-section">
            <div class="white-card">
                <!-- 市场标签 -->
                <div class="market-tag">
                    <span class="market-badge">美国股票市场</span>
                </div>

                <!-- 股票代码和公司名称 -->
                <div class="stock-info">
                    <h2 class="stock-code">META</h2>
                    <p class="company-name">元平台</p>
                </div>

                <!-- 分隔线 -->
                <div class="divider"></div>

                <!-- 投资建议 -->
                <div class="recommendation-section">
                    <p class="recommendation-label">投资建议</p>
                    <div class="recommendation-card-wrapper">
                        <div class="recommendation-card">
                            <p class="recommendation-text">卖出</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部区域 - 报告信息 -->
        <div class="bottom-section">
            <div class="bottom-content">
                <p>分析日期：2025-11-04</p>
                <p>生成系统：TradingAgents 多智能体分析系统</p>
            </div>
        </div>
    </div>
</body>
</html>
