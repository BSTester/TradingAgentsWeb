[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.1.0"
description = "TradingAgentsWeb — 多智能体量化分析框架的 Web 平台（美股/港股/A股）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# 运行时依赖的单一事实源（single source of truth）。
# - `pip install -e .` 安装本清单；
# - `requirements.txt` 为本清单的超集（额外包含 ta-lib 等可选/重型依赖，
#   以及本地开发依赖），本地开发推荐 `pip install -r requirements.txt`。
# 修改依赖时请同步更新 requirements.txt 顶部注释所指的本清单。
dependencies = [
    # --- 数据源 ---
    "akshare>=1.16.98",
    "baostock>=0.8.8",
    "yfinance>=0.2.63",
    "eodhd>=1.0.32",
    "finnhub-python>=2.4.23",
    "tushare>=1.4.21",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.9.0",
    "parsel>=1.10.0",
    "lxml>=4.6.0",
    "praw>=7.8.1",
    "requests>=2.32.4",
    "pytz>=2025.2",
    "python-dateutil>=2.8.0",

    # --- 数据分析 ---
    "pandas>=2.3.0",
    "numpy>=1.21.0",
    "stockstats>=0.6.5",
    "backtrader>=1.9.78.123",
    "openpyxl>=3.0.0",

    # --- AI / LLM ---
    "langchain-openai>=0.3.23",
    "langchain-anthropic>=0.3.15",
    "langchain-google-genai>=2.1.5",
    "langchain-experimental>=0.3.4",
    "langgraph>=0.4.8",
    "chromadb>=1.0.12",

    # --- Web 后端 ---
    "fastapi>=0.104.0",
    "uvicorn>=0.15.0",
    "jinja2>=3.0.0",
    "pydantic[email]",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "aiomysql>=0.2.0",
    "pymysql>=1.0.0",
    "alembic>=1.7.0",
    "redis>=6.2.0",

    # --- 认证 / 安全 ---
    "bcrypt==4.0.1",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.5",
    "python-dotenv>=0.19.0",

    # --- 报告 / 输出 ---
    "markdown>=3.4.0",
    "reportlab>=4.0,<6",
    "grip>=4.6.2",

    # --- 其他 ---
    "chainlit>=2.5.5",
    "questionary>=2.1.0",
    "typer>=0.9.0",
    "rich>=14.0.0",
    "tqdm>=4.67.1",
    "setuptools>=80.9.0",
    "typing-extensions>=4.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.10.0",
    "httpx>=0.24.0",
]

[project.scripts]
tradingagents = "cli.main:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "web*"]

[tool.pytest.ini_options]
testpaths = ["web/backend/tests"]